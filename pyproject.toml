[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stillframe-homeassistant"
version = "0.1.0"
description = "Local Stillframe frame control for Home Assistant"
requires-python = ">=3.13"

[project.optional-dependencies]
test = ["aiohttp>=3.11", "pytest>=8", "pytest-asyncio>=1", "ruff"]

[tool.setuptools.packages.find]
include = ["custom_components.stillframe*"]

[tool.setuptools.package-data]
"custom_components.stillframe" = ["*.json", "*.yaml", "translations/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
